name: Release core tarball

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: messanga11_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d messanga11_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_INTEGRATION_URL: postgresql://postgres@127.0.0.1:5432/messanga11_test
      REDIS_INTEGRATION_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run check && npm run build && npm run typecheck && npm run test:coverage && npm run check:packages && npm run check:tarballs && npm run check:fixtures

      - name: Build core release assets
        run: npm run pack:github-release -- release-assets "${{ github.event.release.tag_name }}"

      - name: Attach core tarball, SBOM and checksums
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
